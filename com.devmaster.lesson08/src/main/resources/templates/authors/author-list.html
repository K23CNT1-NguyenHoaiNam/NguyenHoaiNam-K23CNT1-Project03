<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Author List</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body style="background: #ccc">

<section class="container my-3 bg-white p-3">

    <h2>Author List</h2>

    <table class="table table-bordered">
        <thead class="table-light">
        <tr>
            <th>ID</th>
            <th>Code</th>
            <th>Name</th>
            <th>Image</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Active</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="author : ${authors}">
            <td th:text="${author.id}"></td>
            <td th:text="${author.code}"></td>
            <td th:text="${author.name}"></td>

            <td>
                <img th:src="${author.imgUrl}"
                     alt="Author image"
                     style="width: 50px; height: 50px; object-fit: cover;">
            </td>

            <td th:text="${author.email}"></td>
            <td th:text="${author.phone}"></td>

            <td>
                <span th:text="${author.isActive ? 'Yes' : 'No'}"
                      class="badge"
                      th:classappend="${author.isActive ? 'bg-success' : 'bg-danger'}"></span>
            </td>

            <td>
                <a th:href="@{/authors/edit/{id}(id=${author.id})}" class="btn btn-sm btn-primary">Edit</a>
                <a th:href="@{/authors/delete/{id}(id=${author.id})}"
                   onclick="return confirm('Are you sure?');"
                   class="btn btn-sm btn-danger">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/authors/new}" class="btn btn-success mt-2">Add New Author</a>

</section>

</body>
</html>
