<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Author Form</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body style="background: #ccc">

<section class="container my-3 p-3 bg-white">

    <form th:action="@{/authors/new}" th:object="${author}" method="post"
          enctype="multipart/form-data">

        <input type="hidden" th:if="${author.id != null}" th:field="*{id}"/>

        <div class="card">

            <div class="card-header">
                <h2 th:text="${author.id != null ? 'Edit Author' : 'Create Author'}"></h2>
            </div>

            <div class="card-body">

                <!-- Code -->
                <div class="mb-3 row">
                    <label class="col-sm-2 col-form-label">Code</label>
                    <div class="col-sm-10">
                        <input type="text" th:field="*{code}" class="form-control"/>
                    </div>
                </div>

                <!-- Name -->
                <div class="mb-3 row">
                    <label class="col-sm-2 col-form-label">Name</label>
                    <div class="col-sm-10">
                        <input type="text" th:field="*{name}" class="form-control"/>
                    </div>
                </div>

                <!-- Image -->
                <div class="mb-3 row">
                    <label class="col-sm-2 col-form-label">Image</label>
                    <div class="col-sm-10">

                        <input type="file" name="imageAuthor" class="form-control"/>
                        <input type="hidden" th:field="*{imgUrl}"/>

                        <!-- Hiển thị ảnh cũ -->
                        <div th:if="${author.imgUrl}" class="mt-2">
                            <img th:src="${author.imgUrl}" style="width: 100px;">
                        </div>
                    </div>
                </div>

                <!-- Description -->
                <div class="mb-3 row">
                    <label class="col-sm-2 col-form-label">Description</label>
                    <div class="col-sm-10">
                <textarea th:field="*{description}" rows="3"
                          class="form-control"></textarea>
                    </div>
                </div>

                <!-- Email -->
                <div class="mb-3 row">
                    <label class="col-sm-2 col-form-label">Email</label>
                    <div class="col-sm-10">
                        <input type="email" th:field="*{email}" class="form-control"/>
                    </div>
                </div>

                <!-- Phone -->
                <div class="mb-3 row">
                    <label class="col-sm-2 col-form-label">Phone</label>
                    <div class="col-sm-10">
                        <input type="text" th:field="*{phone}" class="form-control"/>
                    </div>
                </div>

                <!-- Address -->
                <div class="mb-3 row">
                    <label class="col-sm-2 col-form-label">Address</label>
                    <div class="col-sm-10">
                        <input type="text" th:field="*{address}" class="form-control"/>
                    </div>
                </div>

                <!-- Active -->
                <div class="mb-3 row">
                    <label class="col-sm-2 col-form-label">Active</label>
                    <div class="col-sm-10">
                        <input type="checkbox" th:field="*{isActive}"/>
                    </div>
                </div>

            </div>

            <div class="card-footer">
                <button type="submit" class="btn btn-success"
                        th:text="${author.id != null ? 'Update' : 'Create'}"></button>
                <a th:href="@{/authors}" class="btn btn-secondary ms-2">Back to list</a>
            </div>

        </div>
    </form>

</section>

</body>
</html>
