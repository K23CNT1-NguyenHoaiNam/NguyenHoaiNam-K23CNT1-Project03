# Spring Application Name
spring.application.name=K23CNT1

# Server Configuration
server.port=8080

# C?u hình CSDL MySQL
# Thêm tham s? allowPublicKeyRetrieval=true ?? kh?c ph?c l?i k?t n?i MySQL 8
spring.datasource.url=jdbc:mysql://localhost:3306/project03db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# C?u hình JPA (Hibernate)
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# C?u hình Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# File Uploads Directory
app.upload.dir=./uploads

# C?u hình Tài nguyên T?nh (Static Resources)
# M?c ??nh, Spring s? tìm trong static/, public/, resources/, META-INF/resources/.
# Không c?n khai báo thêm classpath:/images/ vì images ?ã ???c di chuy?n vào /static/.
spring.web.resources.static-locations=classpath:/static/,classpath:/public/,classpath:/resources/,classpath:/META-INF/resources/