<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - K23CNT1</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        /* CSS dành riêng cho trang login/register */
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        .auth-card {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box; /* Quan trọng để padding không làm tăng chiều rộng */
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn-submit:hover {
            background-color: #0056b3;
        }
        .alert-error {
            color: #dc3545;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #dc3545;
            background-color: #f8d7da;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2 style="text-align: center; margin-bottom: 30px; color: #007bff;">Đăng Nhập</h2>

            <!-- Hiển thị thông báo lỗi khi đăng nhập thất bại -->
            <div th:if="${param.error}" class="alert-error">
                Tên đăng nhập hoặc mật khẩu không đúng.
            </div>

            <!-- Hiển thị thông báo khi đăng xuất thành công -->
            <div th:if="${param.logout}" class="alert-success">
                Bạn đã đăng xuất thành công.
            </div>

            <!-- Hiển thị thông báo khi đăng ký thành công (redirect từ register) -->
            <div th:if="${param.success}" class="alert-success">
                Đăng ký thành công! Vui lòng đăng nhập.
            </div>

            <!-- Form Đăng nhập. Spring Security sẽ xử lý POST đến /auth/login -->
            <form th:action="@{/auth/login}" method="post">
                <div class="form-group">
                    <label for="username">Tên đăng nhập:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Mật khẩu:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn-submit">Đăng Nhập</button>
            </form>

            <p style="text-align: center; margin-top: 20px;">
                Chưa có tài khoản? <a th:href="@{/auth/register}">Đăng ký ngay</a>
            </p>
        </div>
    </div>
</body>
</html>
